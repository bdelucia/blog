AWSTemplateFormatVersion: "2010-09-09"
Description: "Blog Application Infrastructure"

Parameters:
    Environment:
        Type: String
        Default: production
        AllowedValues: [development, staging, production]

    DomainName:
        Type: String
        Description: Domain name for the application
        Default: ""

Resources:
    # VPC and Networking
    VPC:
        Type: AWS::EC2::VPC
        Properties:
            CidrBlock: 10.0.0.0/16
            EnableDnsHostnames: true
            EnableDnsSupport: true
            Tags:
                - Key: Name
                  Value: !Sub "${AWS::StackName}-vpc"

    PublicSubnet1:
        Type: AWS::EC2::Subnet
        Properties:
            VpcId: !Ref VPC
            AvailabilityZone: !Select [0, !GetAZs ""]
            CidrBlock: 10.0.1.0/24
            MapPublicIpOnLaunch: true
            Tags:
                - Key: Name
                  Value: !Sub "${AWS::StackName}-public-subnet-1"

    PublicSubnet2:
        Type: AWS::EC2::Subnet
        Properties:
            VpcId: !Ref VPC
            AvailabilityZone: !Select [1, !GetAZs ""]
            CidrBlock: 10.0.2.0/24
            MapPublicIpOnLaunch: true
            Tags:
                - Key: Name
                  Value: !Sub "${AWS::StackName}-public-subnet-2"

    PublicSubnet3:
        Type: AWS::EC2::Subnet
        Properties:
            VpcId: !Ref VPC
            AvailabilityZone: !Select [2, !GetAZs ""]
            CidrBlock: 10.0.3.0/24
            MapPublicIpOnLaunch: true
            Tags:
                - Key: Name
                  Value: !Sub "${AWS::StackName}-public-subnet-3"

    InternetGateway:
        Type: AWS::EC2::InternetGateway
        Properties:
            Tags:
                - Key: Name
                  Value: !Sub "${AWS::StackName}-igw"

    InternetGatewayAttachment:
        Type: AWS::EC2::VPCGatewayAttachment
        Properties:
            InternetGatewayId: !Ref InternetGateway
            VpcId: !Ref VPC

    PublicRouteTable:
        Type: AWS::EC2::RouteTable
        Properties:
            VpcId: !Ref VPC
            Tags:
                - Key: Name
                  Value: !Sub "${AWS::StackName}-public-routes"

    DefaultPublicRoute:
        Type: AWS::EC2::Route
        DependsOn: InternetGatewayAttachment
        Properties:
            RouteTableId: !Ref PublicRouteTable
            DestinationCidrBlock: 0.0.0.0/0
            GatewayId: !Ref InternetGateway

    PublicSubnet1RouteTableAssociation:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
            RouteTableId: !Ref PublicRouteTable
            SubnetId: !Ref PublicSubnet1

    PublicSubnet2RouteTableAssociation:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
            RouteTableId: !Ref PublicRouteTable
            SubnetId: !Ref PublicSubnet2

    PublicSubnet3RouteTableAssociation:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
            RouteTableId: !Ref PublicRouteTable
            SubnetId: !Ref PublicSubnet3

    # Security Groups
    ALBSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Security group for Application Load Balancer
            VpcId: !Ref VPC
            SecurityGroupIngress:
                - IpProtocol: tcp
                  FromPort: 80
                  ToPort: 80
                  CidrIp: 0.0.0.0/0
                - IpProtocol: tcp
                  FromPort: 443
                  ToPort: 443
                  CidrIp: 0.0.0.0/0

    ECSSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Security group for ECS tasks
            VpcId: !Ref VPC
            SecurityGroupIngress:
                - IpProtocol: tcp
                  FromPort: 3000
                  ToPort: 3000
                  SourceSecurityGroupId: !Ref ALBSecurityGroup

    # Application Load Balancer
    ApplicationLoadBalancer:
        Type: AWS::ElasticLoadBalancingV2::LoadBalancer
        Properties:
            Name: !Sub "${AWS::StackName}-alb"
            Scheme: internet-facing
            Type: application
            Subnets:
                - !Ref PublicSubnet1
                - !Ref PublicSubnet2
                - !Ref PublicSubnet3
            SecurityGroups:
                - !Ref ALBSecurityGroup

    ALBTargetGroup:
        Type: AWS::ElasticLoadBalancingV2::TargetGroup
        Properties:
            Name: !Sub "${AWS::StackName}-tg"
            Port: 3000
            Protocol: HTTP
            VpcId: !Ref VPC
            TargetType: ip
            HealthCheckPath: /api/health-simple
            HealthCheckProtocol: HTTP
            HealthCheckIntervalSeconds: 30
            HealthCheckTimeoutSeconds: 5
            HealthyThresholdCount: 2
            UnhealthyThresholdCount: 3

    ALBListener:
        Type: AWS::ElasticLoadBalancingV2::Listener
        Properties:
            DefaultActions:
                - Type: forward
                  TargetGroupArn: !Ref ALBTargetGroup
            LoadBalancerArn: !Ref ApplicationLoadBalancer
            Port: 80
            Protocol: HTTP

    # ECS Cluster
    ECSCluster:
        Type: AWS::ECS::Cluster
        Properties:
            ClusterName: !Sub "${AWS::StackName}-cluster"
            CapacityProviders:
                - FARGATE
                - FARGATE_SPOT
            DefaultCapacityProviderStrategy:
                - CapacityProvider: FARGATE
                  Weight: 1

    # ECS Service
    ECSService:
        Type: AWS::ECS::Service
        DependsOn: ALBListener
        Properties:
            ServiceName: !Sub "${AWS::StackName}-service"
            Cluster: !Ref ECSCluster
            LaunchType: FARGATE
            DesiredCount: 2
            NetworkConfiguration:
                AwsvpcConfiguration:
                    SecurityGroups:
                        - !Ref ECSSecurityGroup
                    Subnets:
                        - !Ref PublicSubnet1
                        - !Ref PublicSubnet2
                        - !Ref PublicSubnet3
                    AssignPublicIp: ENABLED
            TaskDefinition: !Ref ECSTaskDefinition
            LoadBalancers:
                - ContainerName: blog-app
                  ContainerPort: 3000
                  TargetGroupArn: !Ref ALBTargetGroup

    # ECS Task Definition
    ECSTaskDefinition:
        Type: AWS::ECS::TaskDefinition
        Properties:
            Family: !Sub "${AWS::StackName}-task"
            Cpu: 512
            Memory: 1024
            NetworkMode: awsvpc
            RequiresCompatibilities:
                - FARGATE
            ExecutionRoleArn: !Ref ECSExecutionRole
            TaskRoleArn: !Ref ECSTaskRole
            ContainerDefinitions:
                - Name: blog-app
                  Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/blog-app:latest"
                  PortMappings:
                      - ContainerPort: 3000
                        Protocol: tcp
                  Essential: true
                  Environment:
                      - Name: NODE_ENV
                        Value: production
                      - Name: PORT
                        Value: "3000"
                  Secrets:
                      - Name: DATABASE_URL
                        ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:blog/database-url"
                      - Name: NEXT_PUBLIC_SUPABASE_URL
                        ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:blog/supabase-url"
                      - Name: NEXT_PUBLIC_SUPABASE_ANON_KEY
                        ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:blog/supabase-anon-key"
                  LogConfiguration:
                      LogDriver: awslogs
                      Options:
                          awslogs-group: !Ref LogGroup
                          awslogs-region: !Ref AWS::Region
                          awslogs-stream-prefix: ecs

    # CloudWatch Log Group
    LogGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Sub "/ecs/${AWS::StackName}"
            RetentionInDays: 14

    # IAM Roles
    ECSExecutionRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: ecs-tasks.amazonaws.com
                      Action: sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
            Policies:
                - PolicyName: SecretsManagerAccess
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - secretsmanager:GetSecretValue
                            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:blog/*"

    ECSTaskRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: ecs-tasks.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: S3Access
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:PutObject
                                - s3:DeleteObject
                            Resource: !Sub "arn:aws:s3:::${S3Bucket}/*"

    # S3 Bucket for static assets
    S3Bucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: !Sub "${AWS::StackName}-static-assets-${AWS::AccountId}"
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true
            CorsConfiguration:
                CorsRules:
                    - AllowedHeaders: ["*"]
                      AllowedMethods: [GET, PUT, POST, DELETE]
                      AllowedOrigins: ["*"]
                      MaxAge: 3600

Outputs:
    LoadBalancerDNS:
        Description: DNS name of the load balancer
        Value: !GetAtt ApplicationLoadBalancer.DNSName
        Export:
            Name: !Sub "${AWS::StackName}-LoadBalancerDNS"

    LoadBalancerURL:
        Description: URL of the load balancer
        Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
        Export:
            Name: !Sub "${AWS::StackName}-LoadBalancerURL"

    S3BucketName:
        Description: Name of the S3 bucket for static assets
        Value: !Ref S3Bucket
        Export:
            Name: !Sub "${AWS::StackName}-S3BucketName"
